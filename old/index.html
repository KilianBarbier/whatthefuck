<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WTF ?!</title>
  <meta name="description" content="What the fuck ?!" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%3F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Private joke : faux avertissement d'âge au chargement -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <p class="gate-title">⚠️ Attention, il fait chaud ici.</p>
      <p class="gate-q">Avez-vous plus de 18 ans ?</p>
      <div class="gate-actions">
        <button id="gate-yes" class="gate-btn" type="button">Oui, j'ai plus de 18 ans</button>
        <button id="gate-no" class="gate-btn gate-btn--ghost" type="button">Non, retourner à Google</button>
      </div>
    </div>
  </div>

  <main class="stage">
    <button id="wtf" class="wtf-btn" type="button" aria-label="WTF">WTF</button>

    <figure id="reveal" class="reveal" hidden>
      <img id="wtf-img" class="wtf-img" alt="WTF" />
      <figcaption id="wtf-caption" class="caption"></figcaption>
    </figure>

    <!-- Easter egg : s'affiche tous les 10 clics -->
    <div id="def" class="def-card" hidden>
      <h2 class="def-word">Sécheresse</h2>
      <p class="def-pron"><span class="def-ipa">[se·ʃʁɛs]</span> <span class="def-type">nom féminin</span></p>
      <hr class="def-rule" />
      <p class="def-body">
        Absence prolongée de pluie entraînant un manque d'eau ;<br />
        état de ce qui est aride, desséché.
      </p>
      <p class="def-ps">
        P.S. — Si vous avez le nom d'une ville en Normandie, vous
        connaissez sûrement une autre définition.
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
